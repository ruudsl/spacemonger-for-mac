name: Release

# Builds, signs, notarizes and packages a DMG when you push a version tag
# (e.g. `v1.0`). Requires these repository secrets:
#   BUILD_CERTIFICATE_BASE64   - Developer ID Application .p12, base64-encoded
#   P12_PASSWORD               - password for that .p12
#   KEYCHAIN_PASSWORD          - any throwaway password for the temp keychain
#   DEVELOPMENT_TEAM           - your 10-character Team ID
#   AC_NOTARY_PROFILE_JSON     - not used here; we pass the three values below
#   APPLE_ID                   - Apple ID e-mail for notarization
#   APPLE_APP_PASSWORD         - app-specific password for that Apple ID
#
# This file is a template: adjust to your signing identity. It is intentionally
# not run on normal pushes.

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/app.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project SpaceMonger.xcodeproj \
            -scheme SpaceMonger \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SpaceMonger.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive

      - name: Export, package & notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bash scripts/notarize.sh "$RUNNER_TEMP/SpaceMonger.xcarchive"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMonger-dmg
          path: build/SpaceMonger.dmg
